<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
  background-color: #121316;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = 1;
let boardSize = 0;
let cellSize = 0;
let boardLeft = 0;
let boardTop = 0;

let board = [
  [0, 0, 0],
  [0, 0, 0],
  [0, 0, 0]
];

let playerTurn = 1;
let aiPlayer = 2;
let humanPlayer = 1;
let gameState = 0;
let winLine = null;
let stateTimer = 0;
let turnIndicatorProgress = 0;

let winCount = parseInt(localStorage.getItem("ttt_win")) || 0;
let lossCount = parseInt(localStorage.getItem("ttt_loss")) || 0;
let drawCount = parseInt(localStorage.getItem("ttt_draw")) || 0;

let particles = [];
let strokeAnimations = [];
let gridLineAnimations = [];

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'x') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(440, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'o') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.linearRampToValueAtTime(220, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'win') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.3);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'draw') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(110, now + 0.25);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  } catch (e) {}
}

class Vector {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }
  set(x, y) {
    this.x = x;
    this.y = y;
    return this;
  }
  add(v) {
    this.x += v.x;
    this.y += v.y;
    return this;
  }
  sub(v) {
    this.x -= v.x;
    this.y -= v.y;
    return this;
  }
  mult(n) {
    this.x *= n;
    this.y *= n;
    return this;
  }
  div(n) {
    this.x /= n;
    this.y /= n;
    return this;
  }
  mag() {
    return Math.sqrt(this.x * this.x + this.y * this.y);
  }
  heading() {
    return Math.atan2(this.y, this.x);
  }
  copy() {
    return new Vector(this.x, this.y);
  }
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

class Particle {
  constructor(x, y, color) {
    this.pos = new Vector(x, y);
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    this.vel = new Vector(Math.cos(angle) * speed, Math.sin(angle) * speed);
    this.acc = new Vector(0, 0.05);
    this.life = 1.0;
    this.decay = Math.random() * 0.02 + 0.015;
    this.size = Math.random() * 3 + 1.5;
    this.color = color;
  }

  update() {
    this.vel.add(this.acc);
    this.pos.add(this.vel);
    this.life -= this.decay;
  }

  draw(context) {
    if (this.life <= 0) return;
    context.save();
    context.globalAlpha = Math.max(0, this.life);
    context.fillStyle = this.color;
    context.beginPath();
    context.arc(this.pos.x, this.pos.y, this.size, 0, Math.PI * 2);
    context.fill();
    context.restore();
  }
}

function createBurst(x, y, color, count = 20) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color));
  }
}

class StrokeAnimation {
  constructor(type, row, col) {
    this.type = type;
    this.row = row;
    this.col = col;
    this.progress = 0;
    this.speed = 0.045;
    this.completed = false;
    this.seed = Math.random() * 1000;
  }

  update() {
    if (this.progress < 1) {
      this.progress += this.speed;
      if (this.progress >= 1) {
        this.progress = 1;
        this.completed = true;
      }
    }
  }

  draw(context) {
    const cx = boardLeft + this.col * cellSize + cellSize / 2;
    const cy = boardTop + this.row * cellSize + cellSize / 2;
    const radius = cellSize * 0.28;
    const offset = radius;

    context.save();
    context.lineCap = "round";
    context.lineJoin = "round";

    if (this.type === 1) {
      context.strokeStyle = "#e2ece9";
      context.lineWidth = Math.max(3, cellSize * 0.055);

      const p1 = Math.min(1, this.progress * 2);
      if (p1 > 0) {
        context.beginPath();
        const x1 = cx - offset;
        const y1 = cy - offset;
        const x2 = lerp(x1, cx + offset, p1);
        const y2 = lerp(y1, cy + offset, p1);
        
        context.moveTo(x1, y1);
        context.lineTo(x2, y2);
        context.stroke();
      }

      const p2 = Math.max(0, (this.progress - 0.5) * 2);
      if (p2 > 0) {
        context.beginPath();
        const x1 = cx + offset;
        const y1 = cy - offset;
        const x2 = lerp(x1, cx - offset, p2);
        const y2 = lerp(y1, cy + offset, p2);
        
        context.moveTo(x1, y1);
        context.lineTo(x2, y2);
        context.stroke();
      }
    } else if (this.type === 2) {
      context.strokeStyle = "#d69f3d";
      context.lineWidth = Math.max(3, cellSize * 0.055);

      const currentAngle = this.progress * Math.PI * 2;
      context.beginPath();
      context.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + currentAngle);
      context.stroke();
    }

    context.restore();
  }
}

function drawVectorDigit(x, y, digit, size, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, size * 0.12);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const w = size * 0.55;
  const h = size;
  const halfH = h / 2;

  ctx.beginPath();
  switch (digit) {
    case 0:
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      break;
    case 1:
      ctx.moveTo(x + w * 0.5, y);
      ctx.lineTo(x + w * 0.5, y + h);
      break;
    case 2:
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + halfH);
      ctx.lineTo(x, y + halfH);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + w, y + h);
      break;
    case 3:
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + halfH);
      ctx.lineTo(x, y + halfH);
      ctx.moveTo(x + w, y + halfH);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      break;
    case 4:
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + halfH);
      ctx.lineTo(x + w, y + halfH);
      ctx.moveTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      break;
    case 5:
      ctx.moveTo(x + w, y);
      ctx.lineTo(x, y);
      ctx.lineTo(x, y + halfH);
      ctx.lineTo(x + w, y + halfH);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      break;
    case 6:
      ctx.moveTo(x + w, y);
      ctx.lineTo(x, y);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + w, y + halfH);
      ctx.lineTo(x, y + halfH);
      break;
    case 7:
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      break;
    case 8:
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      ctx.moveTo(x, y + halfH);
      ctx.lineTo(x + w, y + halfH);
      break;
    case 9:
      ctx.moveTo(x + w, y + halfH);
      ctx.lineTo(x, y + halfH);
      ctx.lineTo(x, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      break;
  }
  ctx.stroke();
  ctx.restore();
}

function drawVectorNumber(x, y, num, size, color) {
  const str = num.toString();
  const digitWidth = size * 0.55;
  const spacing = size * 0.22;
  const totalWidth = str.length * digitWidth + (str.length - 1) * spacing;
  let startX = x - totalWidth / 2;

  for (let i = 0; i < str.length; i++) {
    const digit = parseInt(str[i]);
    drawVectorDigit(startX, y, digit, size, color);
    startX += digitWidth + spacing;
  }
}

function initGridAnimations() {
  gridLineAnimations = [
    { progress: 0, speed: 0.03 },
    { progress: 0, speed: 0.03 },
    { progress: 0, speed: 0.03 },
    { progress: 0, speed: 0.03 }
  ];
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.scale(dpr, dpr);

  const minDim = Math.min(width, height);
  boardSize = minDim * 0.55;
  cellSize = boardSize / 3;
  boardLeft = (width - boardSize) / 2;
  boardTop = (height - boardSize) / 2;
}

window.addEventListener("resize", resize);
resize();
initGridAnimations();

function disableInteractions() {
  const preventDefaultHandler = (e) => {
    if (e.preventDefault) {
      e.preventDefault();
    }
  };

  window.addEventListener("touchstart", preventDefaultHandler, { passive: false });
  window.addEventListener("touchmove", preventDefaultHandler, { passive: false });
  window.addEventListener("touchend", preventDefaultHandler, { passive: false });
  window.addEventListener("wheel", preventDefaultHandler, { passive: false });
  window.addEventListener("gesturestart", preventDefaultHandler, { passive: false });
  window.addEventListener("gesturechange", preventDefaultHandler, { passive: false });
  window.addEventListener("gestureend", preventDefaultHandler, { passive: false });
  window.addEventListener("contextmenu", preventDefaultHandler, { passive: false });
}

disableInteractions();

function checkWinner(b) {
  for (let i = 0; i < 3; i++) {
    if (b[i][0] !== 0 && b[i][0] === b[i][1] && b[i][1] === b[i][2]) {
      return { winner: b[i][0], line: { type: 'h', index: i } };
    }
  }

  for (let j = 0; j < 3; j++) {
    if (b[0][j] !== 0 && b[0][j] === b[1][j] && b[1][j] === b[2][j]) {
      return { winner: b[0][j], line: { type: 'v', index: j } };
    }
  }

  if (b[0][0] !== 0 && b[0][0] === b[1][1] && b[1][1] === b[2][2]) {
    return { winner: b[0][0], line: { type: 'd1', index: 0 } };
  }

  if (b[0][2] !== 0 && b[0][2] === b[1][1] && b[1][1] === b[2][0]) {
    return { winner: b[0][2], line: { type: 'd2', index: 0 } };
  }

  let isFull = true;
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      if (b[i][j] === 0) {
        isFull = false;
        break;
      }
    }
  }

  if (isFull) {
    return { winner: 0, line: null };
  }

  return null;
}

function minimax(b, depth, isMaximizing, alpha, beta) {
  const result = checkWinner(b);
  if (result !== null) {
    if (result.winner === aiPlayer) return 10 - depth;
    if (result.winner === humanPlayer) return depth - 10;
    if (result.winner === 0) return 0;
  }

  if (isMaximizing) {
    let maxEval = -Infinity;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (b[i][j] === 0) {
          b[i][j] = aiPlayer;
          let evalVal = minimax(b, depth + 1, false, alpha, beta);
          b[i][j] = 0;
          maxEval = Math.max(maxEval, evalVal);
          alpha = Math.max(alpha, evalVal);
          if (beta <= alpha) break;
        }
      }
    }
    return maxEval;
  } else {
    let minEval = Infinity;
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) {
        if (b[i][j] === 0) {
          b[i][j] = humanPlayer;
          let evalVal = minimax(b, depth + 1, true, alpha, beta);
          b[i][j] = 0;
          minEval = Math.min(minEval, evalVal);
          beta = Math.min(beta, evalVal);
          if (beta <= alpha) break;
        }
      }
    }
    return minEval;
  }
}

function getBestMove() {
  let bestVal = -Infinity;
  let bestMove = { row: -1, col: -1 };

  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 3; j++) {
      if (board[i][j] === 0) {
        board[i][j] = aiPlayer;
        let moveVal = minimax(board, 0, false, -Infinity, Infinity);
        board[i][j] = 0;
        if (moveVal > bestVal) {
          bestMove.row = i;
          bestMove.col = j;
          bestVal = moveVal;
        }
      }
    }
  }

  return bestMove;
}

function makeMove(row, col, player) {
  if (board[row][col] !== 0 || gameState !== 0) return false;

  board[row][col] = player;
  strokeAnimations.push(new StrokeAnimation(player, row, col));

  const cx = boardLeft + col * cellSize + cellSize / 2;
  const cy = boardTop + row * cellSize + cellSize / 2;

  if (player === 1) {
    playSound('x');
    createBurst(cx, cy, "#e2ece9", 15);
  } else {
    playSound('o');
    createBurst(cx, cy, "#d69f3d", 15);
  }

  const result = checkWinner(board);

  if (result !== null) {
    gameState = 1;
    winLine = result.line;
    stateTimer = 0;

    if (result.winner === humanPlayer) {
      winCount++;
      localStorage.setItem("ttt_win", winCount);
      playSound('win');
    } else if (result.winner === aiPlayer) {
      lossCount++;
      localStorage.setItem("ttt_loss", lossCount);
      playSound('win');
    } else {
      drawCount++;
      localStorage.setItem("ttt_draw", drawCount);
      playSound('draw');
    }

    setTimeout(() => {
      resetGame();
    }, 1500);
  } else {
    playerTurn = player === 1 ? 2 : 1;
  }

  return true;
}

function resetGame() {
  board = [
    [0, 0, 0],
    [0, 0, 0],
    [0, 0, 0]
  ];
  strokeAnimations = [];
  winLine = null;
  gameState = 0;
  playerTurn = 1;
  stateTimer = 0;
  initGridAnimations();
}

function handleInput(clientX, clientY) {
  initAudio();

  if (gameState === 1) {
    return;
  }

  if (playerTurn !== humanPlayer) return;

  if (
    clientX >= boardLeft &&
    clientX <= boardLeft + boardSize &&
    clientY >= boardTop &&
    clientY <= boardTop + boardSize
  ) {
    const col = Math.floor((clientX - boardLeft) / cellSize);
    const row = Math.floor((clientY - boardTop) / cellSize);

    if (row >= 0 && row < 3 && col >= 0 && col < 3) {
      if (makeMove(row, col, humanPlayer)) {
        if (gameState === 0 && playerTurn === aiPlayer) {
          setTimeout(() => {
            if (gameState === 0) {
              const move = getBestMove();
              if (move.row !== -1 && move.col !== -1) {
                makeMove(move.row, move.col, aiPlayer);
              }
            }
          }, 350);
        }
      }
    }
  }
}

canvas.addEventListener("pointerdown", (e) => {
  handleInput(e.clientX, e.clientY);
});

function drawBackground() {
  ctx.fillStyle = "#121316";
  ctx.fillRect(0, 0, width, height);

  ctx.save();
  ctx.strokeStyle = "#1b1d22";
  ctx.lineWidth = 1;

  const bgStep = 40;
  for (let x = 0; x < width; x += bgStep) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();
  }
  for (let y = 0; y < height; y += bgStep) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGrid() {
  ctx.save();
  ctx.strokeStyle = "#2e323b";
  ctx.lineWidth = Math.max(2, cellSize * 0.035);
  ctx.lineCap = "round";

  for (let i = 0; i < gridLineAnimations.length; i++) {
    if (gridLineAnimations[i].progress < 1) {
      gridLineAnimations[i].progress += gridLineAnimations[i].speed;
      if (gridLineAnimations[i].progress > 1) {
        gridLineAnimations[i].progress = 1;
      }
    }
  }

  let p0 = gridLineAnimations[0].progress;
  if (p0 > 0) {
    const x = boardLeft + cellSize;
    const y1 = boardTop;
    const y2 = boardTop + boardSize * p0;
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x, y2);
    ctx.stroke();
  }

  let p1 = gridLineAnimations[1].progress;
  if (p1 > 0) {
    const x = boardLeft + cellSize * 2;
    const y1 = boardTop;
    const y2 = boardTop + boardSize * p1;
    ctx.beginPath();
    ctx.moveTo(x, y1);
    ctx.lineTo(x, y2);
    ctx.stroke();
  }

  let p2 = gridLineAnimations[2].progress;
  if (p2 > 0) {
    const y = boardTop + cellSize;
    const x1 = boardLeft;
    const x2 = boardLeft + boardSize * p2;
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
  }

  let p3 = gridLineAnimations[3].progress;
  if (p3 > 0) {
    const y = boardTop + cellSize * 2;
    const x1 = boardLeft;
    const x2 = boardLeft + boardSize * p3;
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
  }

  ctx.restore();
}

function drawStrokes() {
  for (let i = 0; i < strokeAnimations.length; i++) {
    strokeAnimations[i].update();
    strokeAnimations[i].draw(ctx);
  }
}

function drawWinningLine() {
  if (!winLine || gameState !== 1) return;

  stateTimer++;
  const progress = Math.min(1, stateTimer / 25);

  ctx.save();
  ctx.strokeStyle = "#4ea8de";
  ctx.lineWidth = Math.max(4, cellSize * 0.07);
  ctx.lineCap = "round";

  let x1 = 0, y1 = 0, x2 = 0, y2 = 0;

  if (winLine.type === 'h') {
    y1 = boardTop + winLine.index * cellSize + cellSize / 2;
    y2 = y1;
    x1 = boardLeft + cellSize * 0.2;
    x2 = boardLeft + boardSize - cellSize * 0.2;
  } else if (winLine.type === 'v') {
    x1 = boardLeft + winLine.index * cellSize + cellSize / 2;
    x2 = x1;
    y1 = boardTop + cellSize * 0.2;
    y2 = boardTop + boardSize - cellSize * 0.2;
  } else if (winLine.type === 'd1') {
    x1 = boardLeft + cellSize * 0.2;
    y1 = boardTop + cellSize * 0.2;
    x2 = boardLeft + boardSize - cellSize * 0.2;
    y2 = boardTop + boardSize - cellSize * 0.2;
  } else if (winLine.type === 'd2') {
    x1 = boardLeft + boardSize - cellSize * 0.2;
    y1 = boardTop + cellSize * 0.2;
    x2 = boardLeft + cellSize * 0.2;
    y2 = boardTop + boardSize - cellSize * 0.2;
  }

  const currentX = lerp(x1, x2, progress);
  const currentY = lerp(y1, y2, progress);

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(currentX, currentY);
  ctx.stroke();

  if (progress > 0.1 && Math.random() < 0.4) {
    createBurst(currentX, currentY, "#4ea8de", 2);
  }

  ctx.restore();
}

function drawTurnIndicator() {
  if (gameState !== 0) return;

  turnIndicatorProgress += 0.03;
  const pulse = Math.sin(turnIndicatorProgress) * 0.15 + 0.85;

  ctx.save();
  const indicatorY = boardTop - Math.max(30, height * 0.06);
  const indicatorX = width / 2;
  const iconSize = Math.max(10, cellSize * 0.12);

  if (playerTurn === 1) {
    ctx.strokeStyle = "#e2ece9";
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.moveTo(indicatorX - iconSize, indicatorY - iconSize);
    ctx.lineTo(indicatorX + iconSize, indicatorY + iconSize);
    ctx.moveTo(indicatorX + iconSize, indicatorY - iconSize);
    ctx.lineTo(indicatorX - iconSize, indicatorY + iconSize);
    ctx.stroke();
  } else {
    ctx.strokeStyle = "#d69f3d";
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = pulse;
    ctx.beginPath();
    ctx.arc(indicatorX, indicatorY, iconSize, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawScoreboard() {
  ctx.save();

  const scoreY = boardTop + boardSize + Math.max(35, height * 0.06);
  const sectionSpacing = boardSize / 3;
  const leftX = width / 2 - sectionSpacing;
  const centerX = width / 2;
  const rightX = width / 2 + sectionSpacing;

  const iconRadius = Math.max(7, cellSize * 0.08);
  const numSize = Math.max(14, cellSize * 0.16);

  ctx.strokeStyle = "#e2ece9";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(leftX - iconRadius, scoreY - iconRadius);
  ctx.lineTo(leftX + iconRadius, scoreY + iconRadius);
  ctx.moveTo(leftX + iconRadius, scoreY - iconRadius);
  ctx.lineTo(leftX - iconRadius, scoreY + iconRadius);
  ctx.stroke();
  drawVectorNumber(leftX, scoreY + iconRadius + 12, winCount, numSize, "#e2ece9");

  ctx.strokeStyle = "#4ea8de";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(centerX - iconRadius, scoreY - iconRadius * 0.4);
  ctx.lineTo(centerX + iconRadius, scoreY - iconRadius * 0.4);
  ctx.moveTo(centerX - iconRadius, scoreY + iconRadius * 0.4);
  ctx.lineTo(centerX + iconRadius, scoreY + iconRadius * 0.4);
  ctx.stroke();
  drawVectorNumber(centerX, scoreY + iconRadius + 12, drawCount, numSize, "#4ea8de");

  ctx.strokeStyle = "#d69f3d";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(rightX, scoreY, iconRadius, 0, Math.PI * 2);
  ctx.stroke();
  drawVectorNumber(rightX, scoreY + iconRadius + 12, lossCount, numSize, "#d69f3d");

  ctx.restore();
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function render() {
  drawBackground();
  drawGrid();
  drawStrokes();
  drawWinningLine();
  drawTurnIndicator();
  drawScoreboard();
  drawParticles();

  requestAnimationFrame(render);
}

requestAnimationFrame(render);

class LineArtDecoration {
  constructor(x, y, radius) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    this.angle = 0;
  }
  update() {
    this.angle += 0.01;
  }
  draw(context) {
    context.save();
    context.translate(this.x, this.y);
    context.rotate(this.angle);
    context.strokeStyle = "#1e222b";
    context.lineWidth = 1;
    context.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3;
      const px = Math.cos(a) * this.radius;
      const py = Math.sin(a) * this.radius;
      if (i === 0) context.moveTo(px, py);
      else context.lineTo(px, py);
    }
    context.closePath();
    context.stroke();
    context.restore();
  }
}

];

function MathHelperPointDistance(p1, p2) {
  const dx = p1.x - p2.x;
  const dy = p1.y - p2.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function MathHelperClamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function GameLogicMatrixCopy(matrix) {
  let newMatrix = [];
  for (let i = 0; i < matrix.length; i++) {
    newMatrix[i] = matrix[i].slice();
  }
  return newMatrix;
}

function GameLogicEmptyCells(currentBoard) {
  let cells = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      if (currentBoard[r][c] === 0) {
        cells.push({ row: r, col: c });
      }
    }
  }
  return cells;
}
