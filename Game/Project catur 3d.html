<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project catur 3d</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none}
body,html{width:100%;height:100%;overflow:hidden;background:#0d0b0e;font-family:serif;color:#e2d7c5}
#canvas-container{width:100vw;height:100vh;position:absolute;top:0;left:0;z-index:1}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:15px}
.interactive{pointer-events:auto}
#level-card{background:rgba(20,16,23,0.85);border:2px solid #8c6d46;padding:10px 20px;border-radius:4px;box-shadow:0 10px 25px rgba(0,0,0,0.7);text-align:center;min-width:160px}
#level-card h2{font-size:14px;letter-spacing:2px;color:#a88a58;text-transform:uppercase;margin-bottom:2px}
#level-card .val{font-size:24px;font-weight:bold;color:#f0e6d2}
#btn-menu{background:#2a1f1d;border:1px solid #8c6d46;color:#e2d7c5;padding:8px 16px;border-radius:3px;cursor:pointer;font-family:serif;font-weight:bold;letter-spacing:1px;transition:0.2s}
#btn-menu:hover{background:#42302b;color:#fff}
#level-select-modal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,8,12,0.95);z-index:20;display:flex;flex-direction:column;align-items:center;padding:30px 10px;overflow:hidden}
#level-select-modal h1{color:#c5a059;margin-bottom:20px;letter-spacing:3px;font-size:24px;text-transform:uppercase;text-align:center}
.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:10px;width:100%;max-width:800px;height:calc(100% - 100px);overflow-y:auto;padding:10px;pointer-events:auto}
.level-box{aspect-ratio:1;background:#1a141a;border:1px solid #4a3828;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;transition:0.2s;position:relative}
.level-box.unlocked{background:#2d211e;border-color:#8c6d46}
.level-box.unlocked:hover{background:#4a352f;border-color:#c5a059;transform:scale(1.05)}
.level-box.locked{opacity:0.4;cursor:not-allowed;background:#0f0c0f;border-color:#221a22}
.level-box .num{font-size:18px;font-weight:bold;color:#e2d7c5}
.level-box .status{font-size:9px;margin-top:2px;color:#8c6d46;text-transform:uppercase}
.level-box.locked .status{color:#554455}
#turn-indicator{background:rgba(20,16,23,0.85);border:1px solid #8c6d46;padding:6px 16px;border-radius:20px;font-size:12px;letter-spacing:1px;color:#c5a059;align-self:center}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#100d12}
::-webkit-scrollbar-thumb{background:#4a3828;border-radius:3px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui-layer">
<div style="display:flex;justify-content:space-between;width:100%;align-items:flex-start">
<div id="level-card" class="interactive">
<h2>Tingkat</h2>
<div id="current-level-display" class="val">1</div>
</div>
<button id="btn-menu" class="interactive" onclick="openLevelSelect()">PILIH LEVEL</button>
</div>
<div id="turn-indicator">GILIRAN: PUTIH</div>
<div></div>
</div>

<div id="level-select-modal" class="interactive" style="display:none">
<h1>PILIH LEVEL (1 - 100)</h1>
<div class="grid-container" id="level-grid"></div>
<button id="btn-menu" style="margin-top:15px" onclick="closeLevelSelect()">KEMBALI</button>
</div>

<script>
let currentLevel=parseInt(localStorage.getItem('chess_unlocked_level')||'1');
let selectedLevel=currentLevel;
let scene,camera,renderer,boardGroup,piecesGroup,effectsGroup;
let isMoving=false,boardData=[];
let selectedPiece=null,validMoves=[];

// Kontrol Kamera & Gestur Sentuhan
let isDragging=false, isPanning=false;
let previousMousePosition={x:0,y:0};
let touchStartDist=0;
let touchStartCenter={x:0,y:0};
let touchMoved=false;
let activeTouches=[];

let targetCameraPos=null,targetCameraLookAt=null;
let defaultCameraPos=new THREE.Vector3(0,12,9);
let defaultLookAt=new THREE.Vector3(0,0,0);
let currentLookAt=new THREE.Vector3(0,0,0);
let turn='W';

const BOARD_SIZE=8;
const TILE_SIZE=1.2;

function init(){
const container=document.getElementById('canvas-container');
scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0b0e);
scene.fog=new THREE.FogExp2(0x0d0b0e,0.03);

camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.copy(defaultCameraPos);

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const ambientLight=new THREE.AmbientLight(0xd5c3a5,0.6);
scene.add(ambientLight);

const dirLight=new THREE.DirectionalLight(0xfff5ea,1.2);
dirLight.position.set(10,20,10);
dirLight.castShadow=true;
dirLight.shadow.mapSize.width=2048;
dirLight.shadow.mapSize.height=2048;
dirLight.shadow.camera.near=0.5;
dirLight.shadow.camera.far=50;
const d=8;
dirLight.shadow.camera.left=-d;
dirLight.shadow.camera.right=d;
dirLight.shadow.camera.top=d;
dirLight.shadow.camera.bottom=-d;
scene.add(dirLight);

const pointLight=new THREE.PointLight(0xa67c52,0.8,15);
pointLight.position.set(0,4,0);
scene.add(pointLight);

boardGroup=new THREE.Group();
piecesGroup=new THREE.Group();
effectsGroup=new THREE.Group();
scene.add(boardGroup);
scene.add(piecesGroup);
scene.add(effectsGroup);

createBoard();
initGame(selectedLevel);

window.addEventListener('resize',onWindowResize);
setupInteraction();
buildLevelGrid();
animate();
}

function createBoard(){
const boardBaseGeo=new THREE.BoxGeometry(BOARD_SIZE*TILE_SIZE+0.8,0.6,BOARD_SIZE*TILE_SIZE+0.8);
const boardBaseMat=new THREE.MeshStandardMaterial({color:0x1c130d,roughness:0.9,metalness:0.1});
const boardBase=new THREE.Mesh(boardBaseGeo,boardBaseMat);
boardBase.position.y=-0.31;
boardBase.receiveShadow=true;
boardGroup.add(boardBase);

const darkMat=new THREE.MeshStandardMaterial({color:0x2b1e1a,roughness:0.7,metalness:0.2});
const lightMat=new THREE.MeshStandardMaterial({color:0x8a7356,roughness:0.5,metalness:0.1});

for(let r=0;r<BOARD_SIZE;r++){
for(let c=0;c<BOARD_SIZE;c++){
const isDark=(r+c)%2===1;
const tileGeo=new THREE.BoxGeometry(TILE_SIZE,0.2,TILE_SIZE);
const tile=new THREE.Mesh(tileGeo,isDark?darkMat:lightMat);
const x=(c-3.5)*TILE_SIZE;
const z=(r-3.5)*TILE_SIZE;
tile.position.set(x,-0.1,z);
tile.receiveShadow=true;
tile.userData={row:r,col:c,isTile:true};
boardGroup.add(tile);
}
}
}

function createPieceShape(type,colorHex){
const group=new THREE.Group();
const mat=new THREE.MeshStandardMaterial({
color:colorHex,
roughness:colorHex===0x110d13?0.3:0.6,
metalness:colorHex===0x110d13?0.5:0.1
});

if(type==='P'){
const geo1=new THREE.ConeGeometry(0.35,0.7,5);
const m1=new THREE.Mesh(geo1,mat);
m1.position.y=0.35;
group.add(m1);
const geo2=new THREE.OctahedronGeometry(0.18);
const m2=new THREE.Mesh(geo2,mat);
m2.position.y=0.8;
group.add(m2);
}else if(type==='R'){
const geo1=new THREE.BoxGeometry(0.65,0.8,0.65);
const m1=new THREE.Mesh(geo1,mat);
m1.position.y=0.4;
group.add(m1);
}else if(type==='N'){
const geo1=new THREE.CylinderGeometry(0.2,0.4,0.6,5);
const m1=new THREE.Mesh(geo1,mat);
m1.position.y=0.3;
group.add(m1);
const geo2=new THREE.TetrahedronGeometry(0.35);
const m2=new THREE.Mesh(geo2,mat);
m2.position.set(0,0.6,0.1);
m2.rotation.x=0.5;
group.add(m2);
}else if(type==='B'){
const geo1=new THREE.CylinderGeometry(0.15,0.35,0.9,6);
const m1=new THREE.Mesh(geo1,mat);
m1.position.y=0.45;
group.add(m1);
const geo2=new THREE.SphereGeometry(0.2,6,6);
const m2=new THREE.Mesh(geo2,mat);
m2.position.y=0.95;
group.add(m2);
}else if(type==='Q'){
const geo1=new THREE.CylinderGeometry(0.2,0.4,1.1,8);
const m1=new THREE.Mesh(geo1,mat);
m1.position.y=0.55;
group.add(m1);
const geo2=new THREE.IcosahedronGeometry(0.28,0);
const m2=new THREE.Mesh(geo2,mat);
m2.position.y=1.2;
group.add(m2);
}else if(type==='K'){
const geo1=new THREE.CylinderGeometry(0.25,0.45,1.2,7);
const m1=new THREE.Mesh(geo1,mat);
m1.position.y=0.6;
group.add(m1);
const geo2=new THREE.DodecahedronGeometry(0.25,0);
const m2=new THREE.Mesh(geo2,mat);
m2.position.y=1.35;
group.add(m2);
}

group.traverse(child=>{
if(child.isMesh){
child.castShadow=true;
child.receiveShadow=true;
}
});
return group;
}

function initGame(level){
selectedLevel=level;
document.getElementById('current-level-display').innerText=level;
turn='W';
document.getElementById('turn-indicator').innerText="GILIRAN: PUTIH";
while(piecesGroup.children.length>0){
piecesGroup.remove(piecesGroup.children[0]);
}
boardData=Array(8).fill(null).map(()=>Array(8).fill(null));

const layout=['R','N','B','Q','K','B','N','R'];
for(let c=0;c<8;c++){
spawnPiece(0,c,'B',layout[c]);
spawnPiece(1,c,'B','P');
spawnPiece(6,c,'W','P');
spawnPiece(7,c,'W',layout[c]);
}
resetCamera();
}

function spawnPiece(r,c,color,type){
const hex=color==='W'?0xd8c8b0:0x110d13;
const pObj=createPieceShape(type,hex);
const x=(c-3.5)*TILE_SIZE;
const z=(r-3.5)*TILE_SIZE;
pObj.position.set(x,0,z);
pObj.userData={row:r,col:c,color:color,type:type};
piecesGroup.add(pObj);
boardData[r][c]=pObj;
}

function setupInteraction(){
const dom=renderer.domElement;

// Mencegah menu konteks klik kanan
dom.addEventListener('contextmenu', e => e.preventDefault());

// MOUSE EVENTS
dom.addEventListener('mousedown', e => {
if(isMoving) return;
isDragging = true;
isPanning = (e.button === 2); // Klik kanan untuk pan
touchMoved = false;
previousMousePosition = { x: e.clientX, y: e.clientY };
});

dom.addEventListener('mousemove', e => {
if(!isDragging || isMoving) return;
const deltaX = e.clientX - previousMousePosition.x;
const deltaY = e.clientY - previousMousePosition.y;

if(Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) touchMoved = true;

if(isPanning){
panCamera(deltaX, deltaY);
}else{
rotateCamera(deltaX, deltaY);
}
previousMousePosition = { x: e.clientX, y: e.clientY };
});

dom.addEventListener('mouseup', e => {
if(!touchMoved && e.button === 0 && !isMoving){
handlePointerClick(e.clientX, e.clientY);
}
isDragging = false;
isPanning = false;
});

// MOUSE WHEEL (ZOOM)
dom.addEventListener('wheel', e => {
e.preventDefault();
if(isMoving) return;
zoomCamera(e.deltaY * 0.01);
}, { passive: false });

// TOUCH EVENTS (1 JARI & 2 JARI)
dom.addEventListener('touchstart', e => {
if(isMoving) return;
activeTouches = Array.from(e.touches);
touchMoved = false;

if(e.touches.length === 1){
isDragging = true;
isPanning = false;
previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}else if(e.touches.length === 2){
isDragging = true;
isPanning = true;
const dx = e.touches[0].clientX - e.touches[1].clientX;
const dy = e.touches[0].clientY - e.touches[1].clientY;
touchStartDist = Math.hypot(dx, dy);
touchStartCenter = {
x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
y: (e.touches[0].clientY + e.touches[1].clientY) / 2
};
}
}, { passive: false });

dom.addEventListener('touchmove', e => {
if(!isDragging || isMoving) return;
e.preventDefault();

if(e.touches.length === 1 && !isPanning){
const deltaX = e.touches[0].clientX - previousMousePosition.x;
const deltaY = e.touches[0].clientY - previousMousePosition.y;
if(Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) touchMoved = true;

rotateCamera(deltaX, deltaY);
previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}else if(e.touches.length === 2){
touchMoved = true;
// Pinch Zoom
const dx = e.touches[0].clientX - e.touches[1].clientX;
const dy = e.touches[0].clientY - e.touches[1].clientY;
const currentDist = Math.hypot(dx, dy);
const distDelta = touchStartDist - currentDist;

if(Math.abs(distDelta) > 2){
zoomCamera(distDelta * 0.02);
touchStartDist = currentDist;
}

// Pan 2 Jari
const currentCenter = {
x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
y: (e.touches[0].clientY + e.touches[1].clientY) / 2
};
const panDeltaX = currentCenter.x - touchStartCenter.x;
const panDeltaY = currentCenter.y - touchStartCenter.y;

panCamera(panDeltaX, panDeltaY);
touchStartCenter = currentCenter;
}
}, { passive: false });

dom.addEventListener('touchend', e => {
if(!touchMoved && activeTouches.length === 1 && !isMoving){
handlePointerClick(activeTouches[0].clientX, activeTouches[0].clientY);
}
activeTouches = Array.from(e.touches);
if(activeTouches.length === 0){
isDragging = false;
isPanning = false;
}
});
}

function rotateCamera(deltaX, deltaY){
const rotateSpeed = 0.005;
const offset = defaultCameraPos.clone().sub(defaultLookAt);

const radius = offset.length();
let theta = Math.atan2(offset.x, offset.z);
let phi = Math.acos(Math.max(-1, Math.min(1, offset.y / radius)));

theta -= deltaX * rotateSpeed;
phi -= deltaY * rotateSpeed;

phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, phi));

offset.x = radius * Math.sin(phi) * Math.sin(theta);
offset.y = radius * Math.cos(phi);
offset.z = radius * Math.sin(phi) * Math.cos(theta);

defaultCameraPos.copy(defaultLookAt).add(offset);
camera.position.copy(defaultCameraPos);
camera.lookAt(defaultLookAt);
}

function panCamera(deltaX, deltaY){
const panSpeed = 0.015;
const forward = new THREE.Vector3();
camera.getWorldDirection(forward);
forward.y = 0;
forward.normalize();

const right = new THREE.Vector3();
right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

const move = new THREE.Vector3();
move.addScaledVector(right, -deltaX * panSpeed);
move.addScaledVector(forward, deltaY * panSpeed);

// Batasi jarak geser peta agar tidak hilang dari penglihatan
const maxPan = 8;
const tempLookAt = defaultLookAt.clone().add(move);
if(Math.abs(tempLookAt.x) < maxPan && Math.abs(tempLookAt.z) < maxPan){
defaultLookAt.add(move);
defaultCameraPos.add(move);
camera.position.copy(defaultCameraPos);
camera.lookAt(defaultLookAt);
currentLookAt.copy(defaultLookAt);
}
}

function zoomCamera(delta){
const offset = defaultCameraPos.clone().sub(defaultLookAt);
let dist = offset.length();
dist += delta;

// Batas zoom terdekat dan terjauh
dist = Math.max(5, Math.min(25, dist));

offset.setLength(dist);
defaultCameraPos.copy(defaultLookAt).add(offset);
camera.position.copy(defaultCameraPos);
}

function handlePointerClick(clientX, clientY){
const rect = renderer.domElement.getBoundingClientRect();
const mouse = new THREE.Vector2(
((clientX - rect.left) / rect.width) * 2 - 1,
-((clientY - rect.top) / rect.height) * 2 + 1
);

const raycaster = new THREE.Raycaster();
raycaster.setFromCamera(mouse, camera);

const intersects = raycaster.intersectObjects([...piecesGroup.children, ...boardGroup.children], true);

if(intersects.length > 0){
let hitObj = intersects[0].object;
while(hitObj.parent && hitObj.parent !== piecesGroup && hitObj.parent !== boardGroup){
hitObj = hitObj.parent;
}

if(hitObj.userData && hitObj.userData.color === turn){
selectPiece(hitObj);
}else if(selectedPiece){
let targetTile = null;
if(hitObj.userData && hitObj.userData.isTile){
targetTile = hitObj.userData;
}else if(hitObj.userData && hitObj.userData.row !== undefined){
targetTile = { row: hitObj.userData.row, col: hitObj.userData.col };
}

if(targetTile && isValidMove(targetTile.row, targetTile.col)){
executeMove(selectedPiece, targetTile.row, targetTile.col);
}
}
}
}

function selectPiece(pObj){
selectedPiece=pObj;
clearHighlights();
calculateValidMoves(pObj.userData.row,pObj.userData.col,pObj.userData.type,pObj.userData.color);
highlightTiles();
}

function clearHighlights(){
effectsGroup.clear();
validMoves=[];
}

function highlightTiles(){
const mat=new THREE.MeshBasicMaterial({color:0x8c6d46,transparent:true,opacity:0.6});
validMoves.forEach(m=>{
const geo=new THREE.PlaneGeometry(TILE_SIZE*0.8,TILE_SIZE*0.8);
const mesh=new THREE.Mesh(geo,mat);
mesh.rotation.x=-Math.PI/2;
mesh.position.set((m.col-3.5)*TILE_SIZE,0.01,(m.row-3.5)*TILE_SIZE);
effectsGroup.add(mesh);
});
}

function calculateValidMoves(r,c,type,color){
validMoves=[];
const addMove=(tr,tc)=>{
if(tr<0||tr>7||tc<0||tc>7)return false;
const target=boardData[tr][tc];
if(!target){
validMoves.push({row:tr,col:tc});
return true;
}
if(target.userData.color!==color){
validMoves.push({row:tr,col:tc});
}
return false;
};

if(type==='P'){
const dir=color==='W'?-1:1;
if(r+dir>=0&&r+dir<=7&&!boardData[r+dir][c]){
validMoves.push({row:r+dir,col:c});
if((color==='W'&&r===6)||(color==='B'&&r===1)){
if(!boardData[r+2*dir][c])validMoves.push({row:r+2*dir,col:c});
}
}
[-1,1].forEach(dc=>{
const tr=r+dir,tc=c+dc;
if(tr>=0&&tr<=7&&tc>=0&&tc<=7){
if(boardData[tr][tc]&&boardData[tr][tc].userData.color!==color){
validMoves.push({row:tr,col:tc});
}
}
});
}else if(type==='N'){
const offsets=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
offsets.forEach(o=>addMove(r+o[0],c+o[1]));
}else if(type==='R'||type==='B'||type==='Q'){
const dirs=[];
if(type==='R'||type==='Q')dirs.push([-1,0],[1,0],[0,-1],[0,1]);
if(type==='B'||type==='Q')dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
dirs.forEach(d=>{
let step=1;
while(addMove(r+d[0]*step,c+d[1]*step)){
if(boardData[r+d[0]*step][c+d[1]*step])break;
step++;
}
});
}else if(type==='K'){
for(let dr=-1;dr<=1;dr++){
for(let dc=-1;dc<=1;dc++){
if(dr!==0||dc!==0)addMove(r+dr,c+dc);
}
}
}
}

function isValidMove(r,c){
return validMoves.some(m=>m.row===r&&m.col===c);
}

function executeMove(pObj,targetRow,targetCol){
isMoving=true;
clearHighlights();

const startR=pObj.userData.row;
const startC=pObj.userData.col;
boardData[startR][startC]=null;

const startX=pObj.position.x;
const startZ=pObj.position.z;
const endX=(targetCol-3.5)*TILE_SIZE;
const endZ=(targetRow-3.5)*TILE_SIZE;

const capturedPiece=boardData[targetRow][targetCol];

let progress=0;
const duration=1200;
const startTime=performance.now();

function animateStep(now){
const elapsed=now-startTime;
progress=Math.min(elapsed/duration,1);

const currentX=startX+(endX-startX)*progress;
const currentZ=startZ+(endZ-startZ)*progress;
const currentY=Math.sin(progress*Math.PI)*0.8;

pObj.position.set(currentX,currentY,currentZ);

const povCamPos=new THREE.Vector3(
currentX-(endX-startX)*0.5,
currentY+1.2,
currentZ-(endZ-startZ)*0.5
);
const povLookAt=new THREE.Vector3(currentX,currentY+0.3,currentZ);

camera.position.lerp(povCamPos,0.1);
currentLookAt.lerp(povLookAt,0.1);
camera.lookAt(currentLookAt);

createTrailEffect(currentX,currentY,currentZ);

if(progress<1){
requestAnimationFrame(animateStep);
}else{
pObj.position.set(endX,0,endZ);
pObj.userData.row=targetRow;
pObj.userData.col=targetCol;

if(capturedPiece){
piecesGroup.remove(capturedPiece);
}
boardData[targetRow][targetCol]=pObj;

selectedPiece=null;

setTimeout(()=>{
resetCamera(()=>{
isMoving=false;
switchTurn();
});
},300);
}
}

requestAnimationFrame(animateStep);
}

function createTrailEffect(x,y,z){
const geo=new THREE.SphereGeometry(0.05,4,4);
const mat=new THREE.MeshBasicMaterial({color:0xc5a059,transparent:true,opacity:0.8});
const p=new THREE.Mesh(geo,mat);
p.position.set(x+ (Math.random()-0.5)*0.1,y,z+(Math.random()-0.5)*0.1);
effectsGroup.add(p);

let op=0.8;
const timer=setInterval(()=>{
op-=0.05;
mat.opacity=op;
p.scale.multiplyScalar(0.95);
if(op<=0){
clearInterval(timer);
effectsGroup.remove(p);
}
},30);
}

function resetCamera(onComplete){
defaultLookAt.set(0,0,0);
targetCameraPos=defaultCameraPos.clone();
targetCameraLookAt=defaultLookAt.clone();

let duration=800;
let startTime=performance.now();
let startCamPos=camera.position.clone();
let startLookAt=currentLookAt.clone();

function animateReset(now){
let elapsed=now-startTime;
let p=Math.min(elapsed/duration,1);
let smoothP=0.5-Math.cos(p*Math.PI)/2;

camera.position.lerpVectors(startCamPos,targetCameraPos,smoothP);
currentLookAt.lerpVectors(startLookAt,targetCameraLookAt,smoothP);
camera.lookAt(currentLookAt);

if(p<1){
requestAnimationFrame(animateReset);
}else{
if(onComplete)onComplete();
}
}
requestAnimationFrame(animateReset);
}

function switchTurn(){
turn=turn==='W'?'B':'W';
document.getElementById('turn-indicator').innerText="GILIRAN: "+(turn==='W'?'PUTIH':'HITAM');

if(turn==='B'){
setTimeout(makeAIMove,600);
}
}

function makeAIMove(){
let allMoves=[];
for(let r=0;r<8;r++){
for(let c=0;c<8;c++){
const p=boardData[r][c];
if(p&&p.userData.color==='B'){
calculateValidMoves(r,c,p.userData.type,'B');
validMoves.forEach(m=>{
allMoves.push({piece:p,target:m});
});
}
}
}

if(allMoves.length>0){
let chosenMove;
const diff=selectedLevel/100;
if(Math.random()<diff){
let captures=allMoves.filter(m=>boardData[m.target.row][m.target.col]);
if(captures.length>0){
chosenMove=captures[Math.floor(Math.random()*captures.length)];
}else{
chosenMove=allMoves[Math.floor(Math.random()*allMoves.length)];
}
}else{
chosenMove=allMoves[Math.floor(Math.random()*allMoves.length)];
}

executeMove(chosenMove.piece,chosenMove.target.row,chosenMove.target.col);
}else{
if(selectedLevel===currentLevel&&currentLevel<100){
currentLevel++;
localStorage.setItem('chess_unlocked_level',currentLevel.toString());
alert("Level "+selectedLevel+" Selesai! Level "+currentLevel+" Terbuka.");
}
initGame(selectedLevel);
}
}

function buildLevelGrid(){
const grid=document.getElementById('level-grid');
grid.innerHTML='';
for(let i=1;i<=100;i++){
const box=document.createElement('div');
const isUnlocked=i<=currentLevel;
box.className='level-box '+(isUnlocked?'unlocked':'locked');

const num=document.createElement('div');
num.className='num';
num.innerText=i;

const status=document.createElement('div');
status.className='status';
status.innerText=isUnlocked?(i===currentLevel?'AKTIF':'SELESAI'):'TERKUNCI';

box.appendChild(num);
box.appendChild(status);

if(isUnlocked){
box.onclick=()=>{
selectedLevel=i;
closeLevelSelect();
initGame(i);
};
}
grid.appendChild(box);
}
}

function openLevelSelect(){
buildLevelGrid();
document.getElementById('level-select-modal').style.display='flex';
}

function closeLevelSelect(){
document.getElementById('level-select-modal').style.display='none';
}

function onWindowResize(){
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
}

function animate(){
requestAnimationFrame(animate);
renderer.render(scene,camera);
}

window.onload=init;
</script>
</body>
</html>
