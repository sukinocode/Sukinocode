<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>suki</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background-color: #050505; touch-action: none; user-select: none; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070709);
scene.fog = new THREE.FogExp2(0x070709, 0.025);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(5.5, 2.2, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = false;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 - 0.01;
controls.minPolarAngle = 0.1;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight1.position.set(10, 20, 12);
dirLight1.castShadow = true;
dirLight1.shadow.mapSize.width = 2048;
dirLight1.shadow.mapSize.height = 2048;
dirLight1.shadow.bias = -0.0001;
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x446688, 1.0);
dirLight2.position.set(-10, 10, -10);
scene.add(dirLight2);

const floorLight = new THREE.PointLight(0x880000, 3, 10);
floorLight.position.set(0, 0.2, 0);
scene.add(floorLight);

const gridFloor = new THREE.GridHelper(40, 40, 0x550000, 0x111115);
gridFloor.position.y = -0.01;
scene.add(gridFloor);

const planeGeo = new THREE.PlaneGeometry(60, 60);
const planeMat = new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 0.3, metalness: 0.7 });
const ground = new THREE.Mesh(planeGeo, planeMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const carGroup = new THREE.Group();

const darkRedMat = new THREE.MeshPhysicalMaterial({
  color: 0x4a0002,
  metalness: 0.8,
  roughness: 0.12,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  reflectivity: 1.0
});

const carbonMat = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.4, metalness: 0.6 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x020202, metalness: 0.95, roughness: 0.05, transmission: 0.1, transparent: true, opacity: 0.95 });
const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 3 });
const taillightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.85 });
const rimMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.95, roughness: 0.1 });
const spikeMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.2 });

const mainBodyShape = new THREE.Shape();
mainBodyShape.moveTo(-2.3, 0.22);
mainBodyShape.lineTo(-1.9, 0.20);
mainBodyShape.lineTo(-1.1, 0.24);
mainBodyShape.lineTo(-0.2, 0.58);
mainBodyShape.lineTo(0.7, 0.58);
mainBodyShape.lineTo(1.5, 0.34);
mainBodyShape.lineTo(2.1, 0.26);
mainBodyShape.lineTo(2.3, 0.40);
mainBodyShape.lineTo(1.8, 0.45);
mainBodyShape.lineTo(0.9, 0.82);
mainBodyShape.lineTo(-0.3, 0.82);
mainBodyShape.lineTo(-1.5, 0.48);
mainBodyShape.lineTo(-2.3, 0.22);

const mainExtrudeSettings = { depth: 1.65, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.09, bevelThickness: 0.09 };
const mainBodyGeo = new THREE.ExtrudeGeometry(mainBodyShape, mainExtrudeSettings);
mainBodyGeo.center();
const mainBody = new THREE.Mesh(mainBodyGeo, darkRedMat);
mainBody.position.y = 0.45;
mainBody.castShadow = true;
mainBody.receiveShadow = true;
carGroup.add(mainBody);

const hoodGeo = new THREE.BoxGeometry(1.25, 0.08, 1.35);
const hood = new THREE.Mesh(hoodGeo, darkRedMat);
hood.position.set(1.15, 0.45, 0);
hood.rotation.z = -0.12;
hood.castShadow = true;
carGroup.add(hood);

const cabinShape = new THREE.Shape();
cabinShape.moveTo(-0.65, 0.58);
cabinShape.lineTo(0.42, 0.58);
cabinShape.lineTo(0.12, 0.95);
cabinShape.lineTo(-0.55, 0.95);

const cabinExtrudeSettings = { depth: 1.25, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
const cabinGeo = new THREE.ExtrudeGeometry(cabinShape, cabinExtrudeSettings);
cabinGeo.center();
const cabin = new THREE.Mesh(cabinGeo, glassMat);
cabin.position.set(-0.1, 0.54, 0);
cabin.castShadow = true;
carGroup.add(cabin);

const roofGeo = new THREE.BoxGeometry(0.75, 0.04, 1.2);
const roof = new THREE.Mesh(roofGeo, darkRedMat);
roof.position.set(-0.32, 1.01, 0);
roof.castShadow = true;
carGroup.add(roof);

const sideSkirtGeo = new THREE.BoxGeometry(3.7, 0.1, 1.78);
const sideSkirt = new THREE.Mesh(sideSkirtGeo, carbonMat);
sideSkirt.position.set(0, 0.23, 0);
sideSkirt.castShadow = true;
carGroup.add(sideSkirt);

const splitterGeo = new THREE.BoxGeometry(0.85, 0.04, 1.85);
const splitter = new THREE.Mesh(splitterGeo, carbonMat);
splitter.position.set(2.05, 0.19, 0);
splitter.castShadow = true;
carGroup.add(splitter);

const wingBaseGeo = new THREE.BoxGeometry(0.08, 0.38, 1.25);
const wingBaseLeft = new THREE.Mesh(wingBaseGeo, carbonMat);
wingBaseLeft.position.set(-2.05, 0.68, 0.42);
wingBaseLeft.rotation.z = -0.2;
carGroup.add(wingBaseLeft);

const wingBaseRight = new THREE.Mesh(wingBaseGeo, carbonMat);
wingBaseRight.position.set(-2.05, 0.68, -0.42);
wingBaseRight.rotation.z = -0.2;
carGroup.add(wingBaseRight);

const wingGeo = new THREE.BoxGeometry(0.42, 0.04, 1.9);
const wing = new THREE.Mesh(wingGeo, darkRedMat);
wing.position.set(-2.1, 0.86, 0);
wing.rotation.z = 0.08;
wing.castShadow = true;
carGroup.add(wing);

const headlightGeo = new THREE.BoxGeometry(0.22, 0.05, 0.42);
const hlLeft = new THREE.Mesh(headlightGeo, headlightMat);
hlLeft.position.set(2.1, 0.44, 0.58);
hlLeft.rotation.y = -0.3;
carGroup.add(hlLeft);

const hlRight = new THREE.Mesh(headlightGeo, headlightMat);
hlRight.position.set(2.1, 0.44, -0.58);
hlRight.rotation.y = 0.3;
carGroup.add(hlRight);

const taillightGeo = new THREE.BoxGeometry(0.08, 0.08, 0.65);
const tlLeft = new THREE.Mesh(taillightGeo, taillightMat);
tlLeft.position.set(-2.22, 0.54, 0.52);
carGroup.add(tlLeft);

const tlRight = new THREE.Mesh(taillightGeo, taillightMat);
tlRight.position.set(-2.22, 0.54, -0.52);
carGroup.add(tlRight);

function createSpikedWheel() {
  const wheelGroup = new THREE.Group();

  const tireRadius = 0.52;
  const tireWidth = 0.42;

  const tireGeo = new THREE.CylinderGeometry(tireRadius, tireRadius, tireWidth, 36);
  const tire = new THREE.Mesh(tireGeo, tireMat);
  tire.rotation.x = Math.PI / 2;
  tire.castShadow = true;
  wheelGroup.add(tire);

  const rimGeo = new THREE.CylinderGeometry(0.3, 0.3, tireWidth + 0.01, 18);
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.rotation.x = Math.PI / 2;
  wheelGroup.add(rim);

  const spokeCount = 5;
  for (let i = 0; i < spokeCount; i++) {
    const spokeGeo = new THREE.BoxGeometry(0.07, tireWidth + 0.02, 0.48);
    const spoke = new THREE.Mesh(spokeGeo, rimMat);
    spoke.rotation.y = (i * Math.PI * 2) / spokeCount;
    wheelGroup.add(spoke);
  }

  const spikeCountRadius = 18;
  const spikeCountRows = 3;
  const spikeHeight = 0.14;

  for (let r = 0; r < spikeCountRows; r++) {
    const rowOffset = (r - 1) * 0.12;
    for (let i = 0; i < spikeCountRadius; i++) {
      const angle = (i * Math.PI * 2) / spikeCountRadius + (r * 0.18);
      const spikeGeo = new THREE.ConeGeometry(0.04, spikeHeight, 8);
      const spike = new THREE.Mesh(spikeGeo, spikeMat);

      const x = (tireRadius + spikeHeight / 2 - 0.01) * Math.cos(angle);
      const y = (tireRadius + spikeHeight / 2 - 0.01) * Math.sin(angle);

      spike.position.set(x, y, rowOffset);
      spike.rotation.z = angle - Math.PI / 2;
      spike.castShadow = true;
      wheelGroup.add(spike);
    }
  }

  return wheelGroup;
}

const wheelFL = createSpikedWheel();
wheelFL.position.set(1.3, 0.52, 0.98);
carGroup.add(wheelFL);

const wheelFR = createSpikedWheel();
wheelFR.position.set(1.3, 0.52, -0.98);
carGroup.add(wheelFR);

const wheelRL = createSpikedWheel();
wheelRL.position.set(-1.4, 0.52, 0.98);
carGroup.add(wheelRL);

const wheelRR = createSpikedWheel();
wheelRR.position.set(-1.4, 0.52, -0.98);
carGroup.add(wheelRR);

scene.add(carGroup);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

const arrivalStartTime = performance.now();
const arrivalDuration = 5000;
const wheels = [wheelFL, wheelFR, wheelRL, wheelRR];

function cubicEaseOut(t) {
  return 1 - Math.pow(1 - t, 3);
}

function animate() {
  requestAnimationFrame(animate);

  const currentTime = performance.now();
  const elapsed = currentTime - arrivalStartTime;

  if (elapsed < arrivalDuration) {
    const rawProgress = elapsed / arrivalDuration;
    const progress = cubicEaseOut(rawProgress);

    carGroup.position.x = 25 * (1 - progress);
    carGroup.position.y = 2 * Math.pow(1 - progress, 2);
    carGroup.rotation.y = 0.35 * (1 - progress);
    carGroup.rotation.z = -0.05 * Math.sin(rawProgress * Math.PI);

    const wheelRotationSpeed = (1 - rawProgress) * 0.4;
    wheels.forEach(wheel => {
      wheel.rotation.z -= wheelRotationSpeed;
    });

    const camProgress = Math.sin(rawProgress * Math.PI * 0.5);
    camera.position.x = THREE.MathUtils.lerp(18, 5.5, camProgress);
    camera.position.y = THREE.MathUtils.lerp(0.8, 2.2, camProgress);
    camera.position.z = THREE.MathUtils.lerp(14, 6.5, camProgress);
    controls.target.set(carGroup.position.x * 0.3, 0.4, 0);

    renderer.toneMappingExposure = THREE.MathUtils.lerp(0.2, 1.25, Math.min(rawProgress * 1.5, 1));
    headlightMat.emissiveIntensity = THREE.MathUtils.lerp(0.5, 3.0, rawProgress);
    floorLight.intensity = THREE.MathUtils.lerp(0.5, 3.0, rawProgress);
  } else {
    carGroup.position.set(0, 0, 0);
    carGroup.rotation.set(0, 0, 0);
    controls.target.set(0, 0, 0);
    renderer.toneMappingExposure = 1.25;
    headlightMat.emissiveIntensity = 3.0;
    floorLight.intensity = 3.0;
    controls.update();
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
