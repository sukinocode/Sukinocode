<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Lamborghini Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050505;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;

        const carGroup = new THREE.Group();
        scene.add(carGroup);

        const bodyMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffbb00,
            metalness: 0.6,
            roughness: 0.2,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x050505,
            metalness: 0.9,
            roughness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });

        const blackMaterial = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.5,
            roughness: 0.8
        });

        const rimMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            metalness: 0.9,
            roughness: 0.2
        });

        const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const taillightMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        const bodyShape = new THREE.Shape();
        bodyShape.moveTo(-1.8, 0.2);
        bodyShape.lineTo(-1.65, 0.2);
        bodyShape.absarc(-1.1, 0.2, 0.55, Math.PI, 0, true);
        bodyShape.lineTo(0.55, 0.2);
        bodyShape.absarc(1.1, 0.2, 0.55, Math.PI, 0, true);
        bodyShape.lineTo(1.8, 0.3);
        bodyShape.lineTo(1.8, 0.85);
        bodyShape.lineTo(-0.5, 0.75);
        bodyShape.lineTo(-1.7, 0.5);
        bodyShape.lineTo(-1.8, 0.2);

        const bodyGeom = new THREE.ExtrudeGeometry(bodyShape, {
            depth: 1.8,
            bevelEnabled: true,
            bevelSegments: 3,
            steps: 1,
            bevelSize: 0.04,
            bevelThickness: 0.04
        });
        const bodyMesh = new THREE.Mesh(bodyGeom, bodyMaterial);
        bodyMesh.position.z = -0.9;
        bodyMesh.castShadow = true;
        bodyMesh.receiveShadow = true;
        carGroup.add(bodyMesh);

        const cabinShape = new THREE.Shape();
        cabinShape.moveTo(-0.4, 0.74);
        cabinShape.lineTo(0.1, 1.15);
        cabinShape.lineTo(0.8, 1.15);
        cabinShape.lineTo(1.6, 0.85);
        cabinShape.lineTo(1.6, 0.77);
        cabinShape.lineTo(-0.4, 0.74);

        const cabinGeom = new THREE.ExtrudeGeometry(cabinShape, {
            depth: 1.3,
            bevelEnabled: true,
            bevelSegments: 3,
            steps: 1,
            bevelSize: 0.04,
            bevelThickness: 0.04
        });
        const cabinMesh = new THREE.Mesh(cabinGeom, glassMaterial);
        cabinMesh.position.z = -0.65;
        cabinMesh.castShadow = true;
        carGroup.add(cabinMesh);

        const wheelGeom = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 32);
        wheelGeom.rotateX(Math.PI / 2);
        const rimGeom = new THREE.CylinderGeometry(0.25, 0.25, 0.32, 16);
        rimGeom.rotateX(Math.PI / 2);

        const wheelPositions = [
            [-1.1, 0.35, 0.85],
            [1.1, 0.35, 0.85],
            [-1.1, 0.35, -0.85],
            [1.1, 0.35, -0.85]
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeom, blackMaterial);
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.castShadow = true;
            
            const rim = new THREE.Mesh(rimGeom, rimMaterial);
            wheel.add(rim);
            
            carGroup.add(wheel);
        });

        const pillarGeom = new THREE.BoxGeometry(0.1, 0.2, 0.05);
        const wingGeom = new THREE.BoxGeometry(0.3, 0.05, 1.6);
        
        const pillar1 = new THREE.Mesh(pillarGeom, blackMaterial);
        pillar1.position.set(1.6, 0.95, 0.5);
        pillar1.castShadow = true;
        
        const pillar2 = new THREE.Mesh(pillarGeom, blackMaterial);
        pillar2.position.set(1.6, 0.95, -0.5);
        pillar2.castShadow = true;
        
        const wing = new THREE.Mesh(wingGeom, bodyMaterial);
        wing.position.set(1.7, 1.05, 0);
        wing.castShadow = true;
        
        carGroup.add(pillar1, pillar2, wing);

        const intakeGeom = new THREE.BoxGeometry(0.3, 0.25, 0.1);
        const intake1 = new THREE.Mesh(intakeGeom, blackMaterial);
        intake1.position.set(0.5, 0.45, 0.9);
        const intake2 = new THREE.Mesh(intakeGeom, blackMaterial);
        intake2.position.set(0.5, 0.45, -0.9);
        carGroup.add(intake1, intake2);

        const hlGeom = new THREE.BoxGeometry(0.2, 0.05, 0.1);
        const hl1 = new THREE.Mesh(hlGeom, headlightMaterial);
        hl1.position.set(-1.7, 0.48, 0.7);
        hl1.rotation.z = Math.PI / 8;
        const hl2 = new THREE.Mesh(hlGeom, headlightMaterial);
        hl2.position.set(-1.7, 0.48, -0.7);
        hl2.rotation.z = Math.PI / 8;
        carGroup.add(hl1, hl2);

        const tlGeom = new THREE.BoxGeometry(0.05, 0.05, 0.3);
        const tl1 = new THREE.Mesh(tlGeom, taillightMaterial);
        tl1.position.set(1.82, 0.75, 0.6);
        const tl2 = new THREE.Mesh(tlGeom, taillightMaterial);
        tl2.position.set(1.82, 0.75, -0.6);
        carGroup.add(tl1, tl2);

        const exhaustGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.1, 16);
        exhaustGeom.rotateZ(Math.PI / 2);
        const exhaust = new THREE.Mesh(exhaustGeom, rimMaterial);
        exhaust.position.set(1.8, 0.4, 0);
        carGroup.add(exhaust);

        const floorGeom = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            metalness: 0.8, 
            roughness: 0.2 
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(100, 100, 0x333333, 0x111111);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        const spotLight = new THREE.SpotLight(0xffffff, 5);
        spotLight.position.set(0, 8, 0);
        spotLight.angle = Math.PI / 3;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        scene.add(spotLight);

        carGroup.position.y = -0.15;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let startTime = null;
        controls.enabled = false;

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (!startTime) startTime = timestamp;
            const elapsed = (timestamp - startTime) / 1000;
            const duration = 6.0;

            if (elapsed < duration) {
                const progress = elapsed / duration;

                const carProgress = easeOutCubic(progress);
                carGroup.position.x = -25 * (1 - carProgress);

                const camProgress = easeInOutCubic(progress);
                const startCamPos = new THREE.Vector3(-12, 0.8, 4);
                const endCamPos = new THREE.Vector3(6, 3, 7);
                
                camera.position.lerpVectors(startCamPos, endCamPos, camProgress);
                
                const targetPos = new THREE.Vector3(carGroup.position.x, 0.5, 0);
                camera.lookAt(targetPos);
                controls.target.copy(targetPos);
            } else {
                if (!controls.enabled) {
                    controls.enabled = true;
                    controls.target.set(0, 0.5, 0);
                }
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
