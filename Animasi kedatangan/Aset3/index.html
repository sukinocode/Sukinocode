<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Tamiya Race Car</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; touch-action: none; user-select: none; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0d);
scene.fog = new THREE.FogExp2(0x0a0a0d, 0.025);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4.2, 2.8, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.maxPolarAngle = Math.PI / 2 - 0.01;
controls.minPolarAngle = Math.PI / 6;
controls.target.set(0, 0.45, 0);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
dirLight.position.set(6, 9, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 25;
dirLight.shadow.camera.left = -5;
dirLight.shadow.camera.right = 5;
dirLight.shadow.camera.top = 5;
dirLight.shadow.camera.bottom = -5;
dirLight.shadow.bias = -0.0003;
scene.add(dirLight);

const redRimLight = new THREE.PointLight(0xff1122, 1.5, 12);
redRimLight.position.set(-4, 2.5, -2);
scene.add(redRimLight);

const blueRimLight = new THREE.PointLight(0x2277ff, 1.2, 12);
blueRimLight.position.set(4, 2.5, 3);
scene.add(blueRimLight);

const floorGeo = new THREE.PlaneGeometry(40, 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f1115, roughness: 0.35, metalness: 0.65 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(40, 30, 0x880011, 0x1d212a);
grid.position.y = 0.001;
scene.add(grid);

const carGroup = new THREE.Group();
scene.add(carGroup);

const darkRedMat = new THREE.MeshStandardMaterial({
  color: 0x5a0008,
  roughness: 0.2,
  metalness: 0.45,
  clearcoat: 0.9,
  clearcoatRoughness: 0.08
});

const blackChassisMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.75, metalness: 0.2 });
const silverMat = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.2, metalness: 0.9 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xcc9900, roughness: 0.25, metalness: 0.85 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.9, metalness: 0.1 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x030610, roughness: 0.1, metalness: 0.95 });

const chassisBase = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.12, 3.1), blackChassisMat);
chassisBase.position.y = 0.33;
chassisBase.castShadow = true;
chassisBase.receiveShadow = true;
carGroup.add(chassisBase);

const sideGuardL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 1.7), blackChassisMat);
sideGuardL.position.set(-0.78, 0.33, 0);
carGroup.add(sideGuardL);

const sideGuardR = sideGuardL.clone();
sideGuardR.position.x = 0.78;
carGroup.add(sideGuardR);

const frontBumper = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.06, 0.35), blackChassisMat);
frontBumper.position.set(0, 0.29, -1.72);
frontBumper.castShadow = true;
carGroup.add(frontBumper);

const rearBumper = new THREE.Mesh(new THREE.BoxGeometry(2.35, 0.06, 0.35), blackChassisMat);
rearBumper.position.set(0, 0.29, 1.72);
rearBumper.castShadow = true;
carGroup.add(rearBumper);

function createRoller(x, z) {
  const g = new THREE.Group();
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.24, 8), silverMat);
  pin.position.y = 0.12;
  g.add(pin);
  const roller = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 16), silverMat);
  roller.position.y = 0.2;
  roller.castShadow = true;
  g.add(roller);
  g.position.set(x, 0.31, z);
  return g;
}

carGroup.add(createRoller(-1.08, -1.8));
carGroup.add(createRoller(1.08, -1.8));
carGroup.add(createRoller(-1.08, 1.8));
carGroup.add(createRoller(1.08, 1.8));

function createSpikedWheel() {
  const wheelGroup = new THREE.Group();

  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.44, 24), goldMat);
  rim.rotation.z = Math.PI / 2;
  rim.castShadow = true;
  wheelGroup.add(rim);

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.46, 12), silverMat);
  cap.rotation.z = Math.PI / 2;
  wheelGroup.add(cap);

  const tireBase = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.42, 24), tireMat);
  tireBase.rotation.z = Math.PI / 2;
  tireBase.castShadow = true;
  wheelGroup.add(tireBase);

  const spikeGeo = new THREE.ConeGeometry(0.05, 0.14, 6);
  spikeGeo.translate(0, 0.07, 0);

  const rings = [-0.14, 0, 0.14];
  const countPerRing = 12;

  rings.forEach(xOffset => {
    for (let i = 0; i < countPerRing; i++) {
      const angle = (i / countPerRing) * Math.PI * 2 + (xOffset * 2.5);
      const spike = new THREE.Mesh(spikeGeo, tireMat);
      spike.position.set(xOffset, Math.cos(angle) * 0.54, Math.sin(angle) * 0.54);
      spike.rotation.x = -angle;
      spike.rotation.z = -Math.PI / 2;
      wheelGroup.add(spike);
    }
  });

  return wheelGroup;
}

const wFL = createSpikedWheel();
wFL.position.set(-0.92, 0.56, -1.05);
carGroup.add(wFL);

const wFR = createSpikedWheel();
wFR.position.set(0.92, 0.56, -1.05);
wFR.rotation.y = Math.PI;
carGroup.add(wFR);

const wRL = createSpikedWheel();
wRL.position.set(-0.92, 0.56, 1.05);
carGroup.add(wRL);

const wRR = createSpikedWheel();
wRR.position.set(0.92, 0.56, 1.05);
wRR.rotation.y = Math.PI;
carGroup.add(wRR);

const bodyGroup = new THREE.Group();

const noseShape = new THREE.Shape();
noseShape.moveTo(0, 0);
noseShape.lineTo(0.35, 0.1);
noseShape.lineTo(0.4, 0.35);
noseShape.lineTo(0, 0.45);
noseShape.lineTo(-0.4, 0.35);
noseShape.lineTo(-0.35, 0.1);
noseShape.closePath();

const noseGeo = new THREE.ExtrudeGeometry(noseShape, { depth: 1.25, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.04, bevelThickness: 0.04 });
const nose = new THREE.Mesh(noseGeo, darkRedMat);
nose.rotation.x = Math.PI / 2;
nose.position.set(0, 0.36, -1.42);
nose.scale.set(1.08, 1, 0.68);
nose.castShadow = true;
bodyGroup.add(nose);

const centerBody = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.36, 1.55), darkRedMat);
centerBody.position.set(0, 0.55, 0.1);
centerBody.castShadow = true;
bodyGroup.add(centerBody);

const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), glassMat);
canopy.scale.set(1.0, 0.68, 1.75);
canopy.position.set(0, 0.67, -0.08);
canopy.castShadow = true;
bodyGroup.add(canopy);

const sidePodL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.26, 1.25), darkRedMat);
sidePodL.position.set(-0.54, 0.48, 0.1);
sidePodL.rotation.z = 0.12;
sidePodL.castShadow = true;
bodyGroup.add(sidePodL);

const sidePodR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.26, 1.25), darkRedMat);
sidePodR.position.set(0.54, 0.48, 0.1);
sidePodR.rotation.z = -0.12;
sidePodR.castShadow = true;
bodyGroup.add(sidePodR);

const intakeL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.16, 0.08), blackChassisMat);
intakeL.position.set(-0.54, 0.5, -0.54);
bodyGroup.add(intakeL);

const intakeR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.16, 0.08), blackChassisMat);
intakeR.position.set(0.54, 0.5, -0.54);
bodyGroup.add(intakeR);

const wingStrutL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.42, 0.22), darkRedMat);
wingStrutL.position.set(-0.35, 0.74, 1.22);
wingStrutL.rotation.x = -0.28;
wingStrutL.castShadow = true;
bodyGroup.add(wingStrutL);

const wingStrutR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.42, 0.22), darkRedMat);
wingStrutR.position.set(0.35, 0.74, 1.22);
wingStrutR.rotation.x = -0.28;
wingStrutR.castShadow = true;
bodyGroup.add(wingStrutR);

const wingMain = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.05, 0.42), darkRedMat);
wingMain.position.set(0, 0.94, 1.28);
wingMain.rotation.x = 0.08;
wingMain.castShadow = true;
bodyGroup.add(wingMain);

const wingEndL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.52), darkRedMat);
wingEndL.position.set(-0.79, 0.94, 1.28);
wingEndL.castShadow = true;
bodyGroup.add(wingEndL);

const wingEndR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.28, 0.52), darkRedMat);
wingEndR.position.set(0.79, 0.94, 1.28);
wingEndR.castShadow = true;
bodyGroup.add(wingEndR);

const lockCatch = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.14, 12), goldMat);
lockCatch.position.set(0, 0.71, 0.92);
bodyGroup.add(lockCatch);

carGroup.add(bodyGroup);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const animStartTime = performance.now();
const animDuration = 7000;
controls.enabled = false;

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animate() {
  requestAnimationFrame(animate);
  
  const elapsed = performance.now() - animStartTime;
  const progress = Math.min(elapsed / animDuration, 1);
  const easedProgress = easeInOutCubic(progress);

  if (progress < 1) {
    carGroup.position.z = -15 * (1 - easedProgress);
    carGroup.position.y = 3 * Math.sin((1 - easedProgress) * Math.PI);
    carGroup.rotation.y = (1 - easedProgress) * Math.PI * 0.4;

    const wheelRot = - (1 - progress) * 25;
    wFL.children[2].rotation.x = wheelRot;
    wFR.children[2].rotation.x = wheelRot;
    wRL.children[2].rotation.x = wheelRot;
    wRR.children[2].rotation.x = wheelRot;

    const startCam = new THREE.Vector3(0.5, 0.4, -6);
    const endCam = new THREE.Vector3(4.2, 2.8, 5.2);
    camera.position.lerpVectors(startCam, endCam, easedProgress);

    const targetStart = new THREE.Vector3(0, 0.3, -10);
    const targetEnd = new THREE.Vector3(0, 0.45, 0);
    const currentTarget = new THREE.Vector3().lerpVectors(targetStart, targetEnd, easedProgress);
    controls.target.copy(currentTarget);
    camera.lookAt(currentTarget);
  } else {
    controls.enabled = true;
    controls.update();
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
