<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>suki no wg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040406;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040406);
        scene.fog = new THREE.FogExp2(0x040406, 0.04);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5.2, 2.0, 5.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;
        controls.minPolarAngle = Math.PI / 6;
        controls.target.set(0, 0.4, 0);

        const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 2.2);
        mainLight.position.set(6, 9, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x3a5577, 1.5);
        fillLight.position.set(-6, 6, -5);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 2.0);
        backLight.position.set(0, 5, -8);
        scene.add(backLight);

        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x060608, roughness: 0.25, metalness: 0.85 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(30, 60, 0x222222, 0x111111);
        grid.position.y = 0.001;
        scene.add(grid);

        const car = new THREE.Group();
        scene.add(car);

        const bodyMat = new THREE.MeshPhysicalMaterial({
            color: 0x050505,
            metalness: 0.92,
            roughness: 0.12,
            clearcoat: 1.0,
            clearcoatRoughness: 0.03,
            reflectivity: 1.0
        });

        const carbonMat = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.4,
            roughness: 0.65
        });

        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0x000000,
            metalness: 0.1,
            roughness: 0.05,
            transmission: 0.75,
            transparent: true,
            opacity: 0.85
        });

        const chromeMat = new THREE.MeshStandardMaterial({
            color: 0xeeeeee,
            metalness: 0.95,
            roughness: 0.08
        });

        const rimMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            metalness: 0.9,
            roughness: 0.2
        });

        const brakeMat = new THREE.MeshStandardMaterial({
            color: 0xbb0000,
            metalness: 0.5,
            roughness: 0.3
        });

        const discMat = new THREE.MeshStandardMaterial({
            color: 0x666666,
            metalness: 0.8,
            roughness: 0.3
        });

        const tireMat = new THREE.MeshStandardMaterial({
            color: 0x141414,
            roughness: 0.85,
            metalness: 0.1
        });

        const headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });

        const hoodShape = new THREE.Shape();
        hoodShape.moveTo(1.85, 0.22);
        hoodShape.lineTo(0.7, 0.52);
        hoodShape.lineTo(0.7, 0.25);
        hoodShape.lineTo(1.85, 0.15);
        hoodShape.closePath();
        const hoodExtrude = new THREE.ExtrudeGeometry(hoodShape, { depth: 1.48, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.04, bevelThickness: 0.04 });
        hoodExtrude.center();
        const hoodMesh = new THREE.Mesh(hoodExtrude, bodyMat);
        hoodMesh.position.set(1.15, 0.35, 0);
        hoodMesh.rotation.y = Math.PI / 2;
        hoodMesh.castShadow = true;
        car.add(hoodMesh);

        const cabinShape = new THREE.Shape();
        cabinShape.moveTo(0.7, 0.52);
        cabinShape.lineTo(-0.2, 0.92);
        cabinShape.lineTo(-1.1, 0.72);
        cabinShape.lineTo(-1.0, 0.52);
        cabinShape.lineTo(0.6, 0.52);
        cabinShape.closePath();
        const cabinExtrude = new THREE.ExtrudeGeometry(cabinShape, { depth: 1.18, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.03, bevelThickness: 0.03 });
        cabinExtrude.center();
        const cabinMesh = new THREE.Mesh(cabinExtrude, glassMat);
        cabinMesh.position.set(-0.1, 0.68, 0);
        cabinMesh.rotation.y = Math.PI / 2;
        cabinMesh.castShadow = true;
        car.add(cabinMesh);

        const roofPillarGeo = new THREE.BoxGeometry(1.28, 0.04, 0.86);
        const roofPillar = new THREE.Mesh(roofPillarGeo, bodyMat);
        roofPillar.position.set(-0.2, 0.93, 0);
        roofPillar.rotation.z = -0.15;
        roofPillar.castShadow = true;
        car.add(roofPillar);

        const sideIntakeGeo = new THREE.BoxGeometry(1.8, 0.42, 0.32);
        const leftSide = new THREE.Mesh(sideIntakeGeo, bodyMat);
        leftSide.position.set(-0.1, 0.38, 0.8);
        leftSide.rotation.y = -0.08;
        leftSide.castShadow = true;
        car.add(leftSide);

        const rightSide = leftSide.clone();
        rightSide.position.z = -0.8;
        rightSide.rotation.y = 0.08;
        car.add(rightSide);

        const intakeVentGeo = new THREE.BoxGeometry(0.6, 0.28, 0.05);
        const leftVent = new THREE.Mesh(intakeVentGeo, carbonMat);
        leftVent.position.set(0.2, 0.38, 0.94);
        leftVent.rotation.y = -0.25;
        car.add(leftVent);

        const rightVent = leftVent.clone();
        rightVent.position.z = -0.94;
        rightVent.rotation.y = 0.25;
        car.add(rightVent);

        const splitterGeo = new THREE.BoxGeometry(0.8, 0.06, 1.72);
        const splitter = new THREE.Mesh(splitterGeo, carbonMat);
        splitter.position.set(1.75, 0.1, 0);
        splitter.castShadow = true;
        car.add(splitter);

        const frontBumperGeo = new THREE.BoxGeometry(0.5, 0.22, 1.65);
        const frontBumper = new THREE.Mesh(frontBumperGeo, bodyMat);
        frontBumper.position.set(1.6, 0.22, 0);
        frontBumper.castShadow = true;
        car.add(frontBumper);

        const frontGrilleGeo = new THREE.BoxGeometry(0.1, 0.16, 1.38);
        const frontGrille = new THREE.Mesh(frontGrilleGeo, carbonMat);
        frontGrille.position.set(1.82, 0.18, 0);
        car.add(frontGrille);

        const headLightGeo = new THREE.BoxGeometry(0.35, 0.04, 0.36);
        const leftHead = new THREE.Mesh(headLightGeo, headLightMat);
        leftHead.position.set(1.58, 0.32, 0.54);
        leftHead.rotation.y = -0.3;
        leftHead.rotation.z = -0.15;
        car.add(leftHead);

        const rightHead = leftHead.clone();
        rightHead.position.z = -0.54;
        rightHead.rotation.y = 0.3;
        car.add(rightHead);

        const headLightInnerGeo = new THREE.BoxGeometry(0.25, 0.02, 0.14);
        const leftHeadInner = new THREE.Mesh(headLightInnerGeo, headLightMat);
        leftHeadInner.position.set(1.65, 0.31, 0.44);
        leftHeadInner.rotation.y = 0.2;
        car.add(leftHeadInner);

        const rightHeadInner = leftHeadInner.clone();
        rightHeadInner.position.z = -0.44;
        rightHeadInner.rotation.y = -0.2;
        car.add(rightHeadInner);

        const engineDeckGeo = new THREE.BoxGeometry(1.2, 0.15, 1.28);
        const engineDeck = new THREE.Mesh(engineDeckGeo, bodyMat);
        engineDeck.position.set(-1.1, 0.55, 0);
        engineDeck.rotation.z = -0.1;
        engineDeck.castShadow = true;
        car.add(engineDeck);

        for(let i = 0; i < 4; i++) {
            const louverGeo = new THREE.BoxGeometry(0.18, 0.02, 0.98);
            const louver = new THREE.Mesh(louverGeo, carbonMat);
            louver.position.set(-0.7 - (i * 0.22), 0.63 - (i * 0.025), 0);
            louver.rotation.z = -0.2;
            car.add(louver);
        }

        const wingPillarGeo = new THREE.BoxGeometry(0.08, 0.35, 0.06);
        const leftPillar = new THREE.Mesh(wingPillarGeo, carbonMat);
        leftPillar.position.set(-1.8, 0.68, 0.45);
        leftPillar.rotation.z = 0.15;
        car.add(leftPillar);

        const rightPillar = leftPillar.clone();
        rightPillar.position.z = -0.45;
        car.add(rightPillar);

        const wingBladeGeo = new THREE.BoxGeometry(0.35, 0.04, 1.82);
        const wingBlade = new THREE.Mesh(wingBladeGeo, carbonMat);
        wingBlade.position.set(-1.82, 0.86, 0);
        wingBlade.rotation.z = -0.08;
        wingBlade.castShadow = true;
        car.add(wingBlade);

        const wingEndLeftGeo = new THREE.BoxGeometry(0.35, 0.18, 0.04);
        const wingEndLeft = new THREE.Mesh(wingEndLeftGeo, carbonMat);
        wingEndLeft.position.set(-1.82, 0.88, 0.91);
        car.add(wingEndLeft);

        const wingEndRight = wingEndLeft.clone();
        wingEndRight.position.z = -0.91;
        car.add(wingEndRight);

        const diffuserGeo = new THREE.BoxGeometry(0.6, 0.25, 1.52);
        const diffuser = new THREE.Mesh(diffuserGeo, carbonMat);
        diffuser.position.set(-1.75, 0.2, 0);
        diffuser.rotation.z = 0.12;
        car.add(diffuser);

        for(let i = -2; i <= 2; i++) {
            const finGeo = new THREE.BoxGeometry(0.3, 0.12, 0.03);
            const fin = new THREE.Mesh(finGeo, carbonMat);
            fin.position.set(-1.9, 0.15, i * 0.25);
            car.add(fin);
        }

        const tailLightGeo = new THREE.BoxGeometry(0.05, 0.06, 0.58);
        const leftTail = new THREE.Mesh(tailLightGeo, tailLightMat);
        leftTail.position.set(-1.96, 0.48, 0.46);
        car.add(leftTail);

        const rightTail = leftTail.clone();
        rightTail.position.z = -0.46;
        car.add(rightTail);

        const exhaustGroup = new THREE.Group();
        const exhaustGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.2, 16);
        exhaustGeo.rotateZ(Math.PI / 2);
        const ex1 = new THREE.Mesh(exhaustGeo, chromeMat);
        ex1.position.set(-1.98, 0.32, 0.08);
        const ex2 = new THREE.Mesh(exhaustGeo, chromeMat);
        ex2.position.set(-1.98, 0.32, -0.08);
        const ex3 = new THREE.Mesh(exhaustGeo, chromeMat);
        ex3.position.set(-1.98, 0.32, 0.22);
        const ex4 = new THREE.Mesh(exhaustGeo, chromeMat);
        ex4.position.set(-1.98, 0.32, -0.22);
        exhaustGroup.add(ex1, ex2, ex3, ex4);
        car.add(exhaustGroup);

        const mirrorArmGeo = new THREE.BoxGeometry(0.04, 0.04, 0.22);
        const mirrorHousingGeo = new THREE.BoxGeometry(0.18, 0.1, 0.12);

        const leftArm = new THREE.Mesh(mirrorArmGeo, carbonMat);
        leftArm.position.set(0.45, 0.58, 0.72);
        leftArm.rotation.y = 0.2;
        car.add(leftArm);

        const leftHousing = new THREE.Mesh(mirrorHousingGeo, bodyMat);
        leftHousing.position.set(0.45, 0.6, 0.82);
        leftHousing.rotation.y = -0.1;
        car.add(leftHousing);

        const rightArm = leftArm.clone();
        rightArm.position.z = -0.72;
        rightArm.rotation.y = -0.2;
        car.add(rightArm);

        const rightHousing = leftHousing.clone();
        rightHousing.position.z = -0.82;
        rightHousing.rotation.y = 0.1;
        car.add(rightHousing);

        function createWheel(radius, width) {
            const wheelGroup = new THREE.Group();

            const tireGeo = new THREE.CylinderGeometry(radius, radius, width, 32);
            tireGeo.rotateX(Math.PI / 2);
            const tire = new THREE.Mesh(tireGeo, tireMat);
            tire.castShadow = true;
            wheelGroup.add(tire);

            const rimOuterGeo = new THREE.CylinderGeometry(radius * 0.75, radius * 0.75, width + 0.01, 24);
            rimOuterGeo.rotateX(Math.PI / 2);
            const rimOuter = new THREE.Mesh(rimOuterGeo, rimMat);
            wheelGroup.add(rimOuter);

            for(let i = 0; i < 5; i++) {
                const spokeGeo = new THREE.BoxGeometry(radius * 1.3, 0.04, width * 0.8);
                const spoke = new THREE.Mesh(spokeGeo, chromeMat);
                spoke.rotation.z = (i * Math.PI * 2) / 5;
                wheelGroup.add(spoke);
            }

            const discGeo = new THREE.CylinderGeometry(radius * 0.65, radius * 0.65, 0.03, 24);
            discGeo.rotateX(Math.PI / 2);
            const disc = new THREE.Mesh(discGeo, discMat);
            wheelGroup.add(disc);

            const caliperGeo = new THREE.BoxGeometry(radius * 0.4, 0.08, width * 0.85);
            const caliper = new THREE.Mesh(caliperGeo, brakeMat);
            caliper.position.set(0, radius * 0.35, 0);
            wheelGroup.add(caliper);

            return wheelGroup;
        }

        const wheelFL = createWheel(0.36, 0.26);
        wheelFL.position.set(1.2, 0.36, 0.82);
        car.add(wheelFL);

        const wheelFR = createWheel(0.36, 0.26);
        wheelFR.position.set(1.2, 0.36, -0.82);
        car.add(wheelFR);

        const wheelRL = createWheel(0.4, 0.32);
        wheelRL.position.set(-1.25, 0.4, 0.84);
        car.add(wheelRL);

        const wheelRR = createWheel(0.4, 0.32);
        wheelRR.position.set(-1.25, 0.4, -0.84);
        car.add(wheelRR);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const arrivalDuration = 8.0;
        const clock = new THREE.Clock();
        let currentWheelAngle = 0;

        headLightMat.color.setHex(0x111111);

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInOutSine(t) {
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (elapsedTime < arrivalDuration) {
                const progress = elapsedTime / arrivalDuration;
                
                const driveEase = easeOutCubic(progress);
                const currentX = 25 * (1 - driveEase);
                const prevX = car.position.x;
                car.position.x = currentX;

                const deltaDist = prevX - currentX;
                currentWheelAngle -= deltaDist / 0.38;

                wheelFL.rotation.z = currentWheelAngle;
                wheelFR.rotation.z = currentWheelAngle;
                wheelRL.rotation.z = currentWheelAngle;
                wheelRR.rotation.z = currentWheelAngle;

                const camEase = easeInOutSine(progress);
                
                const camX = THREE.MathUtils.lerp(18.0, 5.2, camEase);
                const camY = THREE.MathUtils.lerp(0.8, 2.0, camEase);
                const camZ = THREE.MathUtils.lerp(14.0, 5.2, camEase);

                const targetX = THREE.MathUtils.lerp(currentX + 1.0, 0, camEase);
                const targetY = THREE.MathUtils.lerp(0.2, 0.4, camEase);
                const targetZ = THREE.MathUtils.lerp(0, 0, camEase);

                camera.position.set(camX, camY, camZ);
                controls.target.set(targetX, targetY, targetZ);
                controls.update();

                if (progress > 0.45) {
                    const lightFactor = Math.min((progress - 0.45) / 0.25, 1);
                    headLightMat.color.setRGB(lightFactor, lightFactor, lightFactor);
                }
            } else {
                controls.update();

                wheelFL.rotation.z -= 0.005;
                wheelFR.rotation.z -= 0.005;
                wheelRL.rotation.z -= 0.005;
                wheelRR.rotation.z -= 0.005;

                headLightMat.color.setHex(0xffffff);
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
