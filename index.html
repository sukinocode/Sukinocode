<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sukinocode Games</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    #screen-offline, #screen-games, #screen-event, #screen-animasi {
      width: 100vw;
      height: calc(100vh - 60px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 0;
      left: 0;
    }
    #screen-offline {
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    #screen-games {
      justify-content: flex-start;
      padding: 20px;
      overflow-y: auto;
    }
    #screen-event {
      justify-content: center;
      padding: 20px;
    }
    #screen-animasi {
      padding: 0;
      margin: 0;
      border: none;
      pointer-events: auto; 
    }
    #iframe-animasi {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none; 
    }
    h1 {
      margin-bottom: 20px;
      font-size: 24px;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }
    .game-card {
      display: flex;
      align-items: center;
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 10px;
      text-decoration: none;
      color: #ffffff;
      border: 1px solid #333;
    }
    .game-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      margin-right: 15px;
    }
    .game-title {
      font-size: 18px;
      font-weight: bold;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 60px;
      background-color: #181818;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.5s ease-out;
    }
    .bottom-nav.show {
      transform: translateY(0);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #888888;
      background: none;
      border: none;
      width: 33.33%;
      height: 100%;
      cursor: pointer;
      font-size: 10px;
      gap: 4px;
    }
    .nav-item.active {
      color: #0088ff;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div id="screen-offline">
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi ini membutuhkan koneksi internet untuk masuk.</p>
  </div>

  <div id="screen-games">
    <h1></h1>
    <div class="game-list">      
      <a href="Game/Balap Suki/index.html" class="game-card">
        <img src="balap suki.jpg" alt="Balap Suki">
        <span class="game-title">Balap Suki</span>
      </a>
      <a href="Game/Panah 3d/index.html" class="game-card">
        <img src="panah 3d.jpg" alt="Panah 3d">
        <span class="game-title">Panah 3d</span>
      </a>
      <a href="Game/Petualangan suki/index.html" class="game-card">
        <img src="Suki adventure.jpg" alt="Petualangan suki">
        <span class="game-title">Petualangan suki</span>
      </a>
      <a href="Game/Project catur 3d/index.html" class="game-card">
        <img src="Project catur 3d.jpg" alt="Project catur 3d">
        <span class="game-title">Project catur 3d</span>
      </a>
      <a href="Game/Suki plane 2/index.html" class="game-card">
        <img src="Suki plane 2.jpg" alt="Suki plane 2">
        <span class="game-title">Suki plane 2</span>
      </a>
      <a href="Game/Suki plane/index.html" class="game-card">
        <img src="Suki plane.jpg" alt="Suki plane">
        <span class="game-title">Suki plane</span>
      </a>
      <a href="Game/TicTacToe Pro/index.html" class="game-card">
        <img src="tic tac toe pro.jpg" alt="TicTacToe Pro">
        <span class="game-title">TicTacToe Pro</span>
      </a>
    </div>
  </div>

  <div id="screen-event">
  </div>

  <div id="screen-animasi">
    <iframe id="iframe-animasi" src=""></iframe>
  </div>

  <nav class="bottom-nav" id="main-nav">
    <button class="nav-item" onclick="switchTab('screen-games', this)">
      <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H9v2H7v-2H5v-2h2V9h2v2h2v2zm4.5 1c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      <span>Daftar Game</span>
    </button>
    <button class="nav-item" onclick="switchTab('screen-event', this)">
      <svg viewBox="0 0 24 24"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
      <span>Event</span>
    </button>
    <button class="nav-item active" onclick="switchTab('screen-animasi', this)">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
      <span>Animasi kedatangan</span>
    </button>
  </nav>

  <script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let activeTabId = 'screen-animasi';
    let currentAnimasiIndex = parseInt(localStorage.getItem('selected_animasi_index') || 0);

    const asetList = [
      'Animasi kedatangan/Aset1/index.html',
      'Animasi kedatangan/Aset2/index.html',
      'Animasi kedatangan/Aset3/index.html',
      'Animasi kedatangan/Aset4/index.html'
    ];

    function updateAnimasi() {
      const iframe = document.getElementById('iframe-animasi');
      iframe.src = asetList[currentAnimasiIndex];
      localStorage.setItem('selected_animasi_index', currentAnimasiIndex);
    }

    document.getElementById('screen-animasi').addEventListener('dblclick', function() {
        currentAnimasiIndex = (currentAnimasiIndex + 1) % asetList.length;
        updateAnimasi();
    });

    function switchTab(screenId, element) {
      activeTabId = screenId;
      if (!navigator.onLine) {
        checkConnection();
        return;
      }
      
      document.getElementById('screen-games').style.display = 'none';
      document.getElementById('screen-event').style.display = 'none';
      document.getElementById('screen-animasi').style.display = 'none';

      document.getElementById(screenId).style.display = 'flex';

      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => item.classList.remove('active'));
      if (element) {
        element.classList.add('active');
      }
    }

    function checkConnection() {
      const offlineScreen = document.getElementById('screen-offline');
      const navBar = document.getElementById('main-nav');
      
      if (navigator.onLine) {
        offlineScreen.style.display = 'none';
        navBar.style.display = 'flex';
        
        document.getElementById('screen-games').style.display = 'none';
        document.getElementById('screen-event').style.display = 'none';
        document.getElementById('screen-animasi').style.display = 'none';

        document.getElementById(activeTabId).style.display = 'flex';
      } else {
        offlineScreen.style.display = 'flex';
        navBar.style.display = 'none';
        
        document.getElementById('screen-games').style.display = 'none';
        document.getElementById('screen-event').style.display = 'none';
        document.getElementById('screen-animasi').style.display = 'none';
      }
    }

    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);
    
    updateAnimasi();
    switchTab('screen-animasi', document.querySelectorAll('.nav-item')[2]);
    checkConnection();

    const iframeAnimasi = document.getElementById('iframe-animasi');
    iframeAnimasi.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('main-nav').classList.add('show');
      }, 1000);
    });
  </script>
</body>
</html>
