<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Online Only</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
        }
        #main-app {
            display: none;
            text-align: center;
        }
        #offline-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="main-app">
        <h1>Aplikasi PWA Online</h1>
        <p>Anda berhasil terhubung dan masuk ke dalam aplikasi.</p>
    </div>

    <div id="offline-screen">
        <h2>Akses Ditolak</h2>
        <p>Aplikasi ini memerlukan koneksi internet aktif untuk dapat dibuka.</p>
        <button onclick="checkConnectionOnEntry()">Coba Lagi</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
